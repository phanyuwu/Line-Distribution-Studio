name: Render Line Distribution

on:
  workflow_dispatch:
    inputs:
      escala:
        description: 'Escala de renderizado (ej. 1 o 1.5)'
        required: true
        default: '1.5'
      modo_render:
        description: 'Tipo de renderizado'
        required: true
        type: choice
        default: 'completo'
        options:
          - completo
          - prueba_12s
          - rango_personalizado
      desde:
        description: 'Desde (ej. 1:30) [Solo rango]'
        required: false
        default: ''
      hasta:
        description: 'Hasta (ej. 2:00) [Solo rango]'
        required: false
        default: ''
      url_mv:
        description: 'Enlace de descarga directa del MV (opcional)'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Instalar FFmpeg y Chromium en el servidor
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser

      - name: Descargar MV si se proporcionó un enlace
        if: "${{ github.event.inputs.url_mv != '' }}"
        run: |
          echo "Descargando MV..."
          curl -L "${{ github.event.inputs.url_mv }}" -o Render_Studio/mv.mp4

      - name: Ejecutar script de renderizado
        run: |
          CMD="node render.js --carpeta ./Render_Studio --escala ${{ github.event.inputs.escala }} --preset veryfast"
          
          if [ "${{ github.event.inputs.modo_render }}" = "prueba_12s" ]; then
            CMD="$CMD --prueba"
          elif [ "${{ github.event.inputs.modo_render }}" = "rango_personalizado" ]; then
            if [ -n "${{ github.event.inputs.desde }}" ]; then
              CMD="$CMD --desde '${{ github.event.inputs.desde }}'"
            fi
            if [ -n "${{ github.event.inputs.hasta }}" ]; then
              CMD="$CMD --hasta '${{ github.event.inputs.hasta }}'"
            fi
          fi
          
          echo "Ejecutando: $CMD"
          eval $CMD
        env:
          CHROMIUM_PATH: /usr/bin/chromium-browser

      - name: Subir video final como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: video-line-distribution
          path: Render_Studio/salida/*.mp4
